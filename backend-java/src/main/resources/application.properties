# ============================================================
#  校园跑腿交易平台 —— 后端配置
#  对应《数据库设计说明书》v1.1 和《接口契约》v1.1，数据库文件不变，仍是 backend/db/app.db
# ============================================================

server.port=8081

# ---------------- 数据源 ----------------
# 默认按项目根目录（IDEA 运行 Spring Boot 时的 working directory）解析到 backend/db/app.db。
# 如需从其他工作目录启动，可设置环境变量 CTCP_DB_PATH 覆盖为绝对路径。
# busy_timeout：SQLite 同时只允许一个写事务，别的线程等 5 秒而不是立刻报错
spring.datasource.url=jdbc:sqlite:${CTCP_DB_PATH:backend/db/app.db}?busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite 外键默认关闭，每条连接都要开一次（数据库设计说明书 §7.1）
# connection-init-sql 会在连接池每次新建连接时自动执行，正好替代手写的 PRAGMA
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# SQLite 是单文件库，连接池开太大只会加剧写锁竞争，够用就行
spring.datasource.hikari.maximum-pool-size=5

# ---------------- JSON ----------------
# 时间统一用 'YYYY-MM-DD HH:MM:SS' 字符串，POJO 里直接用 String 接，
# 不做 Date 转换，避免时区问题（数据库设计说明书 §5）
spring.jackson.default-property-inclusion=non_null

# ---------------- 文件上传 ----------------
# 单文件与整次请求上限都设 5MB（增量契约：图片功能 §3.1）。
# 超出后 Spring 抛 MaxUploadSizeExceededException，由全局异常处理转成 400。
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# 图片/头像本地存储目录（相对项目根目录），可设 CTCP_UPLOAD_DIR 覆盖为绝对路径。
# 通过 /uploads/** 静态映射对外提供访问（WebConfig）。
app.upload.dir=${CTCP_UPLOAD_DIR:uploads}

# ---------------- 日志 ----------------
# 开发期打印执行的 SQL，方便排错；交付时可关掉
logging.level.org.springframework.jdbc.core=DEBUG
