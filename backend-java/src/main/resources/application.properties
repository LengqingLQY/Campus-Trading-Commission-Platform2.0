# ============================================================
#  校园跑腿交易平台 —— 后端配置
#  对应《数据库设计说明书》v1.1 和《接口契约》v1.0，数据库文件不变，仍是 backend/db/app.db
# ============================================================

server.port=8081

# ---------------- 数据源 ----------------
# 绝对路径指向已有的 SQLite 库（避免 IDEA / 命令行工作目录不同导致相对路径找错）
# 换电脑或换路径时，把这里改成你的 app.db 绝对路径即可
# busy_timeout：SQLite 同时只允许一个写事务，别的线程等 5 秒而不是立刻报错
spring.datasource.url=jdbc:sqlite:C:/Users/10240/Desktop/campus-errand-github/backend/db/app.db?busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite 外键默认关闭，每条连接都要开一次（数据库设计说明书 §7.1）
# connection-init-sql 会在连接池每次新建连接时自动执行，正好替代手写的 PRAGMA
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# SQLite 是单文件库，连接池开太大只会加剧写锁竞争，够用就行
spring.datasource.hikari.maximum-pool-size=5

# ---------------- JSON ----------------
# 时间统一用 'YYYY-MM-DD HH:MM:SS' 字符串，POJO 里直接用 String 接，
# 不做 Date 转换，避免时区问题（数据库设计说明书 §5）
spring.jackson.default-property-inclusion=non_null

# ---------------- 日志 ----------------
# 开发期打印执行的 SQL，方便排错；交付时可关掉
logging.level.org.springframework.jdbc.core=DEBUG
